spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kamanote_tech?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root

upload:
  path: ${user.dir}/tmp/uploads # 指定上传文件的存储路径
  # 访问上传文件的URL前缀。这里用 ${server.port} 跟随实际启动端口，
  # 避免端口写死后（例如后端跑在 8081 却返回 8080 的地址）导致图片加载失败。
  url-prefix: http://localhost:${server.port}/images
